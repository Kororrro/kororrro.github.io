<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type='checkbox' id='el1' class='c'/>
    <input type='checkbox' id='el2' class='c'/>
    <input type='checkbox' id='el3' class='c'/> <br>
    <button onclick="wypisz()">Wypisz</button>
    <pre id="wynik"></pre>
    <script>
        function wypisz(){
            let checkbox = document.querySelectorAll("input.c")
            let parag = document.querySelector("#wynik")
            parag.innerHTML = ""
            let turnoff = 0;
            let turnon = 0;

            checkbox.forEach(element => {
                if(element.checked){
                    turnon += 1
                }else{
                    turnoff += 1
                }
            });
            parag.innerHTML = `Włączone checkboxy: ${turnon}\nWyłączone checkboxy: ${turnoff}`
        }
    </script>
</body>
</html>
